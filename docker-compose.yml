version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: burgersosa_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: burgersosa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: burgersosa_backend
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/burgersosa?schema=public
      - JWT_SECRET=secretkey_para_desarrollo_cambiar_en_produccion
      - PORT=3000
      - FRONTEND_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000/api
    container_name: burgersosa_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
